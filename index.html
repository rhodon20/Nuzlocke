<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Pokémon Rogue - Kanto Edition</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <style>
    :root{
      --ui-bg: #0b1020;
      --ui-panel: #111938;
      --ui-panel-2:#0f1631;
      --ui-accent:#00c6d7;
      --ui-accent-2:#ffd54a;
      --ui-danger:#ff6b6b;
      --ui-warning:#ff9800;
      --ui-ok:#4caf50;
      --ui-text:#e8ecff;
      --ui-muted:#9aa3c7;
      --xp-bar: #2196f3;
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #060814;
      color: var(--ui-text);
      margin: 0;
      padding: 10px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #game-container {
      width: 100%;
      max-width: 500px;
      background: linear-gradient(180deg, #0b1020 0%, #070b18 100%);
      padding: 12px;
      border-radius: 16px;
      box-shadow:
        0 0 0 2px rgba(0,198,215,.25),
        0 20px 50px rgba(0,0,0,.7);
      border: 1px solid rgba(0,198,215,.35);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    h1 {
      color: var(--ui-accent-2);
      text-align: center;
      margin: 0;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: .5px;
      text-shadow: 0 2px 0 #000;
      border-bottom: 2px solid rgba(255,213,74,.2);
      padding-bottom: 8px;
    }
    .hidden-title { display: none; }

    /* ======= Battle Scene ======= */
    #battle-scene{
      background-color: #333;
      border-radius: 12px;
      height: 280px;
      position: relative;
      overflow: hidden;
      border: 2px solid #000;
      box-shadow: inset 0 0 40px rgba(0,0,0,.6);
      transition: background 0.5s ease;
    }

    .bg-forest { background: linear-gradient(180deg, #81c784 0%, #2e7d32 30%, #1b5e20 100%); }
    .bg-cave { background: linear-gradient(180deg, #795548 0%, #3e2723 40%, #1a100e 100%); }
    .bg-ocean { background: linear-gradient(180deg, #4fc3f7 0%, #0288d1 40%, #01579b 100%); }
    .bg-night { background: linear-gradient(180deg, #303f9f 0%, #1a237e 40%, #000000 100%); }
    .bg-volcano { background: linear-gradient(180deg, #ff8a65 0%, #d84315 40%, #3e2723 100%); }
    
    /* ZONAS DE COMBATE */
    .combatant-zone {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      z-index: 10;
    }

    #zone-opponent {
      top: 4%; 
      right: 8%;
      width: 120px;
      height: 120px;
    }

    #zone-player {
      bottom: 8%;
      left: 8%;
      width: 150px; 
      height: 150px;
      z-index: 20; 
    }

    .battle-shadow {
      width: 80%;
      height: 18px;
      background: rgba(0,0,0,0.4);
      border-radius: 50%;
      transform: scaleY(0.5);
      filter: blur(3px);
      margin-top: -8px; 
      z-index: 1;
    }

    /* Sprites */
    .sprite-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      position: relative;
      z-index: 5;
      /* Eliminada la animación idle CSS para dejar control a AnimeJS si se desea, 
         o mantenemos una flotación CSS suave simple */
    }

    .sprite-img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      image-rendering: pixelated;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.4));
      transform-origin: bottom center;
    }

    @keyframes idle-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .anim-idle .sprite-img { animation: idle-float 2.5s infinite ease-in-out; }

    /* UI Stats Boxes */
    .stats-box {
      position: absolute;
      background: rgba(17, 25, 56, 0.95);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 6px;
      padding: 4px 8px;
      width: 120px;
      z-index: 30;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      pointer-events: none;
    }
    #opponent-box { left: 12px; top: 12px; }
    #player-box { right: 12px; bottom: 30px; }

    .poke-name { 
      font-weight: 800; font-size: 0.8rem; margin-bottom: 2px; 
      display: flex; justify-content: space-between; align-items:center;
    }
    .poke-lvl { color: var(--ui-accent-2); font-size: 0.8rem; }
    
    .hp-container {
      background: #222;
      height: 6px;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.2);
      position: relative;
    }
    .hp-fill {
      height: 100%;
      background: var(--ui-ok);
      width: 100%;
      /* Eliminada transition CSS para usar AnimeJS */
    }
    .hp-text { font-size: 0.7rem; text-align: right; margin-top: 1px; font-weight: bold; text-shadow: 0 1px 1px black; }
    
    .xp-container {
      margin-top: 2px;
      background: #111;
      height: 3px;
      border-radius: 2px;
      overflow: hidden;
    }
    .xp-fill {
      height: 100%;
      background: var(--xp-bar);
      width: 0%;
      transition: width 0.4s;
    }

    /* Status Tags */
    .status-tag {
      font-size: 0.65rem;
      padding: 1px 3px;
      border-radius: 3px;
      margin-right: 4px;
      font-weight: bold;
      color: #fff;
      display: inline-block;
    }
    .status-BRN { background: #ff5722; }
    .status-PSN { background: #9c27b0; }
    .status-PAR { background: #ffeb3b; color: #000; }
    .status-SLP { background: #90a4ae; }
    .status-FRZ { background: #03a9f4; }

    /* PROYECTILES Y VFX */
    .projectile {
      position: absolute;
      width: 32px;
      height: 32px;
      z-index: 25;
      pointer-events: none;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0; /* Start hidden for animejs fade in */
    }
    .proj-fire { background: radial-gradient(circle, #ffeb3b 20%, #f44336 70%); border-radius: 50%; box-shadow: 0 0 10px orange; }
    .proj-water { background: radial-gradient(circle at 30% 30%, #fff, #2196f3); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 0 10px #03a9f4; }
    .proj-grass { background-color: #4caf50; clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }
    .proj-electric { background: #ffeb3b; clip-path: polygon(25% 0%, 100% 0%, 75% 100%, 0% 100%); box-shadow: 0 0 15px yellow; }
    .proj-rock { background: #795548; border-radius: 50%; border: 2px solid #3e2723; }
    .proj-normal { background: #fff; border-radius: 50%; opacity: 0.8; }
    .proj-ghost { background: #9c27b0; border-radius: 50%; box-shadow: 0 0 15px #e1bee7; opacity: 0.7; }
    
    .vfx-particle {
      position: absolute;
      pointer-events: none;
      font-size: 20px;
      z-index: 26;
      /* CSS Animation removed, driven by AnimeJS */
    }

    /* ======= Logs & Controls ======= */
    #combat-log {
      height: 60px;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--ui-accent);
      padding: 8px;
      overflow-y: auto;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.3;
      color: #fff;
    }

    #controls-area {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

    button {
      background: var(--ui-panel-2);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--ui-text);
      padding: 10px 4px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.1s;
      text-transform: capitalize;
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
    }
    button:active:not(:disabled) { transform: translateY(2px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

    .btn-move { background: #232944; border-bottom: 3px solid rgba(0,0,0,0.3); }
    .btn-move:hover:not(:disabled) { filter: brightness(1.2); }
    
    .type-Fuego { background: #d84315; color: #fff; }
    .type-Agua { background: #1565c0; color: #fff; }
    .type-Planta { background: #2e7d32; color: #fff; }
    .type-Eléctrico { background: #f9a825; color: #000; }
    .type-Normal { background: #78909c; color: #fff; }
    .type-Volador { background: #7e57c2; color: #fff; }
    .type-Bicho { background: #827717; color: #fff; }
    .type-Veneno { background: #6a1b9a; color: #fff; }
    .type-Tierra { background: #795548; color: #fff; }
    .type-Roca { background: #5d4037; color: #fff; }
    .type-Lucha { background: #b71c1c; color: #fff; }
    .type-Psíquico { background: #c2185b; color: #fff; }
    .type-Fantasma { background: #4527a0; color: #fff; }
    .type-Hielo { background: #00acc1; color: #fff; }
    .type-Dragón { background: #311b92; color: #fff; }
    .type-Acero { background: #607d8b; color: #fff; }
    .type-Siniestro { background: #212121; color: #fff; }
    
    .btn-action { background: #37474f; color: #eceff1; }
    .btn-capture { background: #c62828; }
    .btn-potion { background: #2e7d32; }
    .btn-switch { background: #f57f17; color: black; }
    
    #start-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 5px;
    }
    #seed-controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
      margin-top: 4px;
    }
    #seed-input {
      background: #0f1631;
      color: #e8ecff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 10px;
      font-weight: 700;
    }
    #btn-seed-random {
      background: #455a64;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
    }
    #btn-seed-copy {
      background: #37474f;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
    }
    #seed-lock-indicator {
      margin-top: 4px;
      font-size: 0.72rem;
      color: var(--ui-muted);
      text-align: right;
    }
    #btn-normal { background: linear-gradient(135deg, var(--ui-accent-2), var(--ui-warning)); color: #000; padding: 14px; font-size:1.1rem; border:none; }
    #btn-nuzlocke { background: linear-gradient(135deg, #7b1fa2, #4a148c); color: #fff; padding: 14px; font-size:1.1rem; border:none; }
    #btn-daily { background: linear-gradient(135deg, #00897b, #00695c); color: #fff; padding: 14px; font-size:1.1rem; border:none; }
    #run-history {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(0, 198, 215, 0.25);
      border-radius: 10px;
      padding: 8px;
    }
    #run-history h3 {
      margin: 0 0 6px 0;
      font-size: 0.85rem;
      color: var(--ui-accent-2);
    }
    #run-history-list {
      display: grid;
      gap: 4px;
      max-height: 140px;
      overflow-y: auto;
      font-size: 0.75rem;
    }
    .run-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 6px;
      align-items: center;
      background: rgba(255,255,255,0.04);
      border-radius: 6px;
      padding: 4px 6px;
      cursor: pointer;
      transition: background 0.15s ease, outline-color 0.15s ease;
      outline: 1px solid transparent;
    }
    .run-row:hover { background: rgba(255,255,255,0.08); outline-color: rgba(0, 198, 215, 0.35); }
    .run-row-empty { cursor: default; }
    .run-row-empty:hover { background: rgba(255,255,255,0.04); outline-color: transparent; }
    .run-result-loss { color: #ff8a80; font-weight: 700; }
    .run-seed { color: var(--ui-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #run-detail-body {
      flex: 1;
      overflow-y: auto;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.85rem;
      line-height: 1.45;
      white-space: pre-wrap;
      margin-bottom: 10px;
    }
    #replay-overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 16, 32, 0.96);
      z-index: 1200;
      display: none;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      box-sizing: border-box;
    }
    #replay-header { font-size: 0.85rem; color: #ffd54a; }
    #replay-event-box {
      flex: 1;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 8px;
      overflow-y: auto;
      font-size: 0.8rem;
      white-space: pre-wrap;
    }
    #replay-controls { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; }

    #team-bar {
      display: flex;
      justify-content: space-between;
      background: rgba(0,0,0,0.3);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
    }

    /* Generic Modal Overlay */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 16, 32, 0.95);
      z-index: 50;
      display: none;
      flex-direction: column;
      padding: 10px;
      box-sizing: border-box;
      justify-content: center;
    }
    
    .modal-title { text-align:center; margin:0 0 10px 0; color: var(--ui-accent); }
    .modal-list { flex:1; overflow-y:auto; margin-bottom: 10px; }
    
    .modal-card {
      background: var(--ui-panel);
      margin-bottom: 8px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #444;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .modal-card:hover { border-color: var(--ui-accent); }
    .modal-card.selected { border-color: var(--ui-accent-2); background: #222; }
    .modal-card.fainted { opacity: 0.6; filter: grayscale(1); cursor: not-allowed; }
    
    .mode-badge {
      position: absolute;
      top: 5px; left: 5px;
      font-size: 0.7rem;
      background: #333;
      padding: 2px 6px;
      border-radius: 4px;
      opacity: 0.7;
    }
  </style>
  <link rel="stylesheet" href="index.css">
</head>

<body onload="initGame()">

  <div id="game-container">
    <div id="mode-display" class="mode-badge"></div>
    <h1 id="game-title">PokeRogue Kanto</h1>

    <div id="battle-scene" class="bg-forest">
      <div id="vfx-layer" style="position:absolute; inset:0; pointer-events:none; z-index:40;"></div>

      <div class="stats-box" id="opponent-box"></div>
      
      <div class="combatant-zone" id="zone-opponent">
        <div class="sprite-container anim-idle" id="opponent-sprite-slot"></div>
        <div class="battle-shadow"></div>
      </div>

      <div class="combatant-zone" id="zone-player">
        <div class="sprite-container anim-idle" id="player-sprite-slot"></div>
        <div class="battle-shadow"></div>
      </div>

      <div class="stats-box" id="player-box"></div>
    </div>

    <div id="team-bar">
      <span>Medallas x<b id="badges-val">0</b></span>
      <span>Pokeballs x<b id="balls-val">0</b></span>
      <span>Pociones x<b id="pots-val">0</b></span>
      <span>Racha: <b id="streak-val">0</b></span>
    </div>

    <div id="combat-log">Bienvenido a Kanto Rogue.</div>

    <div id="controls-area">
      <div id="move-controls" class="grid-2"></div>
      
      <div id="utility-controls" class="grid-3">
        <button class="btn-action btn-potion" onclick="usePotion()" id="btn-potion">Poción</button>
        <button class="btn-action btn-capture" onclick="attemptCapture()" id="btn-capture">Capturar</button>
        <button class="btn-action btn-switch" onclick="openSwitchMenu()" id="btn-switch">Cambiar</button>
      </div>

      <div class="grid-2">
        <button class="btn-action" onclick="saveGame()">Guardar</button>
        <button class="btn-action" onclick="loadGame()" id="btn-load" disabled>Cargar</button>
      </div>
      <button class="btn-action" onclick="exportRunLog()" id="btn-export-log">Exportar Run Log</button>
      <button class="btn-action" onclick="importReplayFile()" id="btn-import-replay">Importar Replay</button>
    </div>

    <div id="start-buttons">
      <div id="seed-controls">
        <input id="seed-input" type="text" placeholder="Seed de run (opcional)" maxlength="40">
        <button id="btn-seed-random" onclick="randomizeSeed()">Aleatoria</button>
        <button id="btn-seed-copy" onclick="copyRunSeed()">Copiar</button>
      </div>
      <div id="seed-lock-indicator"></div>
      <button id="btn-normal" onclick="startGame('normal')">Modo Normal</button>
      <button id="btn-nuzlocke" onclick="startGame('nuzlocke')">Modo Nuzlocke</button>
      <button id="btn-daily" onclick="startDailyChallenge()">Desafío Diario</button>
      <div id="run-history">
        <h3>Últimas Runs</h3>
        <div id="run-history-list"></div>
      </div>
    </div>

    <div id="switch-overlay" class="modal-overlay">
      <h3 class="modal-title">Elige un Pokémon</h3>
      <div id="switch-list" class="modal-list"></div>
      <button class="btn-action" onclick="closeSwitchMenu()">Cancelar</button>
    </div>

    <div id="move-overlay" class="modal-overlay">
      <h3 class="modal-title">¡Límite de movimientos!</h3>
      <p style="text-align:center; font-size:0.9rem; margin-bottom:10px;">Elige un movimiento para olvidar:</p>
      <div id="move-list" class="modal-list"></div>
      <button class="btn-action" id="btn-cancel-learn">No aprender</button>
    </div>

    <div id="party-full-overlay" class="modal-overlay">
      <h3 class="modal-title">¡Equipo Completo!</h3>
      <p style="text-align:center; font-size:0.9rem; margin-bottom:10px;">Selecciona un Pokémon para <b>liberar</b> y hacer sitio al nuevo, o libera al capturado.</p>
      <div id="party-full-list" class="modal-list"></div>
      <button class="btn-action btn-capture" id="btn-release-new">Liberar al Nuevo</button>
    </div>

    <div id="replay-overlay">
      <div id="replay-header"></div>
      <div id="replay-event-box"></div>
      <div id="replay-controls">
        <button class="btn-action" onclick="replayPrev()">Anterior</button>
        <button class="btn-action" onclick="replayNext()">Siguiente</button>
        <button class="btn-action" onclick="replayTogglePlay()" id="btn-replay-play">Play</button>
        <button class="btn-action" onclick="closeReplayViewer()">Cerrar</button>
      </div>
    </div>
    <div id="run-detail-overlay" class="modal-overlay">
      <h3 class="modal-title">Detalle de Run</h3>
      <div id="run-detail-body"></div>
      <button class="btn-action" onclick="closeRunDetails()">Cerrar</button>
    </div>
    <input type="file" id="replay-file-input" accept=".json,application/json" style="display:none">
  </div>

<script>
/* =========================================================
   DATABASE & CONFIG
========================================================= */
const CONSTANTS = {
  START_BALLS: 6,
  START_POTS: 6,
  MAX_BALLS: 100,
  MAX_POTS: 50,
  HEAL_STREAK: 3,
  XP_MULT: 4.5, 
  SHINY_CHANCE: 0.005,
  MAX_TEAM: 6
};

const SLUG_MAP = {
  "Nidoran-F": "nidoran-f", "Nidoran-M": "nidoran-m", "Mr. Mime": "mr-mime", "Farfetch'd": "farfetchd"
};
</script>
<script src="moveset.js"></script>
<script src="pok_catalog.js"></script>
<script src="evolutions.js"></script>
<script src="types.js"></script>
<script>
/* =========================================================
   GAME STATE
========================================================= */
const SAVE_KEY = 'poke_save';
const SAVE_VERSION = 2;
const RUN_HISTORY_KEY = 'poke_run_history';
const RUN_HISTORY_LIMIT = 20;

let state = {
  team: [],
  inventory: { balls: 0, pots: 0 },
  streak: 0,
  badges: 0,
  activeIdx: 0,
  gameMode: 'normal', // 'normal' | 'nuzlocke' | 'daily' | 'roguerun'
  runSeed: '',
  rngState: 0,
  runStartedAt: 0,
  dailyChallenge: null,
  rogueRun: null,
  runLog: null
};
let opponent = null;
let battleField = {
  player: { reflectTurns: 0, lightScreenTurns: 0, spikesLayers: 0, toxicSpikesLayers: 0, stealthRock: false },
  opponent: { reflectTurns: 0, lightScreenTurns: 0, spikesLayers: 0, toxicSpikesLayers: 0, stealthRock: false },
  weather: { type: null, turns: 0 },
  runEvent: null
};
let turnLock = false;
Object.defineProperty(window, 'turnLock', {
  get: () => turnLock,
  set: (value) => { turnLock = !!value; }
});

const spriteApiCache = new Map();

/* =========================================================
   CLASSES
========================================================= */
class Pokemon {
  constructor(name, level, isNuzlocke = false) {
    const data = POKEMON_SPECIES[name];
    this.name = name;
    this.level = level;
    this.types = data.type;
    this.xp = 0;
    this.xpToNext = level * 60 + 100;
    this.isShiny = gameRandom() < CONSTANTS.SHINY_CHANCE;
    this.status = null;
    this.sleepTurns = 0;
    this.freezeTurns = 0;
    this.flinched = false;
    this.confusionTurns = 0;
    this.statusShieldTurns = 0;
    this.confusionShieldTurns = 0;
    this.healBlockTurns = 0;
    this.disableTurns = 0;
    this.disabledMoveKey = null;
    this.lastUsedMoveKey = null;
    this.leechSeedBySide = null;
    this.perishTurns = 0;
    this.comboStacks = 0;
    this.lastMoveType = null;
    this.moveCooldowns = {};
    
    this.bonusMultiplier = 1.0;
    this.baseStats = {
      hp: data.hp, atk: data.atk, def: data.def, 
      spa: data.sp_atk, spd: data.sp_def, spe: data.speed
    };
    
    this.stages = { atk:0, def:0, spa:0, spd:0, spe:0, acc:0, eva:0 };

    this.recalcStats();
    this.hp = this.maxHp;

    if (isNuzlocke) {
      const allMoves = Object.keys(MOVES);
      this.moves = [];
      const numMoves = Math.min(4, Math.max(1, Math.floor(level / 5)));
      for(let i=0; i<numMoves; i++) {
        const rnd = allMoves[Math.floor(gameRandom() * allMoves.length)];
        if(!this.moves.includes(rnd)) this.moves.push(rnd);
      }
    } else {
      this.moves = (data.moves || ['Tackle']).filter(mName => MOVES[mName]);
      if (this.moves.length === 0) this.moves = ['Tackle'];
    }
  }

  recalcStats() {
    const mult = this.bonusMultiplier;
    this.maxHp = Math.floor(0.01 * (2 * this.baseStats.hp * mult) * this.level) + this.level + 10;
    this.atk = Math.floor(0.01 * (2 * this.baseStats.atk * mult) * this.level) + 5;
    this.def = Math.floor(0.01 * (2 * this.baseStats.def * mult) * this.level) + 5;
    this.spa = Math.floor(0.01 * (2 * this.baseStats.spa * mult) * this.level) + 5;
    this.spd = Math.floor(0.01 * (2 * this.baseStats.spd * mult) * this.level) + 5;
    this.spe = Math.floor(0.01 * (2 * this.baseStats.spe * mult) * this.level) + 5;
  }

  getStat(statName) {
    let base = this[statName]; 
    let stage = this.stages[statName] || 0;
    let multiplier = getStageMultiplier(stage);
    let finalVal = Math.floor(base * multiplier);
    if (statName === 'spe' && this.status === 'PAR') finalVal = Math.floor(finalVal * 0.5);
    return Math.max(1, finalVal);
  }

  resetStages() {
    this.stages = { atk:0, def:0, spa:0, spd:0, spe:0, acc:0, eva:0 };
    this.sleepTurns = 0;
    this.freezeTurns = 0;
    this.flinched = false;
    this.confusionTurns = 0;
    this.statusShieldTurns = 0;
    this.confusionShieldTurns = 0;
    this.healBlockTurns = 0;
    this.disableTurns = 0;
    this.disabledMoveKey = null;
    this.lastUsedMoveKey = null;
    this.tauntTurns = 0;
    this.protectThisTurn = false;
    this.protectStreak = 0;
    this.pendingSwitch = null;
    this.leechSeedBySide = null;
    this.perishTurns = 0;
    this.comboStacks = 0;
    this.lastMoveType = null;
  }
}

const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));


function isSeedLockedMode() {
  const startButtons = $('start-buttons');
  const inBattleView = !!startButtons && startButtons.style.display === 'none';
  return inBattleView && state.gameMode === 'daily' && !!state.dailyChallenge?.active;
}

function getCurrentSeedValue() {
  if (state.runSeed) return state.runSeed;
  const input = $('seed-input');
  return normalizeSeed(input ? input.value : '');
}

async function copyRunSeed() {
  const seed = getCurrentSeedValue();
  if (!seed) {
    alert('No hay seed para copiar.');
    return;
  }
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(seed);
      log(`Seed copiada: <b>${seed}</b>`);
      return;
    }
  } catch {}
  window.prompt('Copia la seed:', seed);
}

function refreshSeedUiState() {
  const input = $('seed-input');
  const randomBtn = $('btn-seed-random');
  const lockInfo = $('seed-lock-indicator');
  const locked = isSeedLockedMode();
  if (input) input.disabled = locked;
  if (randomBtn) randomBtn.disabled = locked;
  if (lockInfo) {
    lockInfo.innerText = locked
      ? 'Seed bloqueada por Desafío Diario.'
      : 'Seed editable para runs normales y nuzlocke.';
  }
}

function getTodayDateKey() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function makeDeterministicPicker(seedText) {
  let x = hashSeedToUint32(seedText) || 0x9e3779b9;
  return () => {
    x ^= x << 13;
    x ^= x >>> 17;
    x ^= x << 5;
    return ((x >>> 0) / 4294967296);
  };
}

function buildDailyChallenge(dateKey) {
  const seed = `daily-${dateKey}`;
  const pick = makeDeterministicPicker(seed);
  const pool = ['NO_POTION', 'NO_CAPTURE', 'ENEMY_LEVEL'];
  const modifiers = [];

  while (modifiers.length < 2) {
    const idx = Math.floor(pick() * pool.length);
    const key = pool[idx];
    if (!modifiers.includes(key)) modifiers.push(key);
  }

  const enemyLevelBonus = modifiers.includes('ENEMY_LEVEL') ? (2 + Math.floor(pick() * 3)) : 0;
  const labels = modifiers.map(key => {
    if (key === 'NO_POTION') return 'Sin Pociones';
    if (key === 'NO_CAPTURE') return 'Sin Capturas';
    return `Rival +${enemyLevelBonus} niveles`;
  });

  return {
    active: true,
    dateKey,
    seed,
    modifiers,
    enemyLevelBonus,
    labels
  };
}

function isDailyActive() {
  return state.gameMode === 'daily' && state.dailyChallenge && state.dailyChallenge.active;
}

function hasDailyModifier(key) {
  return !!(isDailyActive() && Array.isArray(state.dailyChallenge.modifiers) && state.dailyChallenge.modifiers.includes(key));
}

function startDailyChallenge() {
  const challenge = buildDailyChallenge(getTodayDateKey());
  state.dailyChallenge = challenge;
  const seedInput = $('seed-input');
  if (seedInput) seedInput.value = challenge.seed;
  startGame('daily');
}

window.startDailyChallenge = startDailyChallenge;

let currentRunRecorded = false;
const REPLAY_CHECKPOINT_INTERVAL = 10;

function getRunHistory() {
  const raw = localStorage.getItem(RUN_HISTORY_KEY);
  if (!raw) return [];
  try {
    const data = JSON.parse(raw);
    return Array.isArray(data) ? data : [];
  } catch {
    return [];
  }
}

function saveRunHistory(history) {
  localStorage.setItem(RUN_HISTORY_KEY, JSON.stringify(history.slice(0, RUN_HISTORY_LIMIT)));
}

function formatDuration(totalMs) {
  const s = Math.max(0, Math.floor((totalMs || 0) / 1000));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${sec}s`;
  return `${sec}s`;
}

function renderRunHistory() {
  const listEl = $('run-history-list');
  if (!listEl) return;
  const history = getRunHistory();
  if (!history.length) {
    listEl.innerHTML = '<div class="run-row run-row-empty"><span class="run-seed">Sin runs registradas todavía.</span></div>';
    return;
  }

  listEl.innerHTML = history.slice(0, 8).map((run, idx) => {
    const resultClass = run.result === 'DERROTA' ? 'run-result-loss' : '';
    const left = `<span class="${resultClass}">${run.result}</span>`;
    const seed = `<span class="run-seed" title="${run.seed}">${run.seed}</span>`;
    const modeTag = run.mode === 'daily' ? 'Diario' : (run.mode || 'normal');
    const right = `<span>${modeTag} | Racha ${run.streak} | ${run.duration}</span>`;
    return `<div class="run-row" onclick="openRunDetails(${idx})" title="Ver detalle">${left}${seed}${right}</div>`;
  }).join('');
}

function formatRunEndedAt(endedAtIso) {
  if (!endedAtIso) return 'N/D';
  const dt = new Date(endedAtIso);
  if (Number.isNaN(dt.getTime())) return 'N/D';
  return dt.toLocaleString();
}

function openRunDetails(index) {
  const history = getRunHistory();
  if (!Array.isArray(history) || index < 0 || index >= history.length) return;
  const run = history[index];
  const modeTag = run.mode === 'daily' ? 'Diario' : (run.mode || 'normal');
  const endedAt = formatRunEndedAt(run.endedAt);
  const lines = [
    `Resultado: ${run.result || 'N/D'}`,
    `Modo: ${modeTag}`,
    `Seed: ${run.seed || 'sin-seed'}`,
    `Finalizada: ${endedAt}`,
    `Duración: ${run.duration || 'N/D'}`,
    `Racha: ${Number.isFinite(run.streak) ? run.streak : 0}`,
    `Medallas: ${Number.isFinite(run.badges) ? run.badges : 0}`,
    `Equipo: ${Number.isFinite(run.teamSize) ? run.teamSize : 0}`,
    `Vivos al final: ${Number.isFinite(run.alive) ? run.alive : 0}`,
    `Nivel máximo: ${Number.isFinite(run.maxLevel) ? run.maxLevel : 0}`
  ];
  const body = $('run-detail-body');
  if (body) body.innerText = lines.join('\n');
  const overlay = $('run-detail-overlay');
  if (overlay) overlay.style.display = 'flex';
}

function closeRunDetails() {
  const overlay = $('run-detail-overlay');
  if (overlay) overlay.style.display = 'none';
}

function startRunTracking() {
  state.runStartedAt = Date.now();
  currentRunRecorded = false;
  initRunLog();
  recordRunEvent('run_start', {
    mode: state.gameMode,
    seed: state.runSeed,
    daily: state.dailyChallenge || null
  });
}

function recordRunResult(resultLabel) {
  if (currentRunRecorded) return;
  currentRunRecorded = true;
  const endedAt = Date.now();
  const startedAt = Number.isFinite(state.runStartedAt) && state.runStartedAt > 0 ? state.runStartedAt : endedAt;
  const durationMs = Math.max(0, endedAt - startedAt);
  const maxLevel = state.team.reduce((max, p) => Math.max(max, p.level || 0), 0);
  const aliveCount = state.team.filter(p => p.hp > 0).length;
  const entry = {
    endedAt: new Date(endedAt).toISOString(),
    result: resultLabel,
    mode: state.gameMode || 'normal',
    seed: state.runSeed || 'sin-seed',
    streak: state.streak || 0,
    badges: state.badges || 0,
    teamSize: state.team.length || 0,
    alive: aliveCount,
    maxLevel,
    duration: formatDuration(durationMs)
  };
  const history = getRunHistory();
  history.unshift(entry);
  saveRunHistory(history);
  renderRunHistory();
  if (state.runLog) {
    state.runLog.result = resultLabel;
    state.runLog.endedAt = new Date(endedAt).toISOString();
  }
}

function initRunLog() {
  state.runLog = {
    schemaVersion: 2,
    startedAt: new Date().toISOString(),
    mode: state.gameMode || 'normal',
    seed: state.runSeed || '',
    initialRngState: Number.isFinite(state.rngState) ? (state.rngState >>> 0) : 0,
    dailyChallenge: state.dailyChallenge || null,
    events: [],
    replay: {
      seed: state.runSeed || '',
      initialRngState: Number.isFinite(state.rngState) ? (state.rngState >>> 0) : 0,
      actionSequence: [],
      rngCheckpoints: []
    }
  };
}

function appendReplayCheckpoint(trigger, tMs) {
  const replay = state.runLog?.replay;
  if (!replay) return;
  replay.rngCheckpoints.push({
    idx: replay.rngCheckpoints.length,
    trigger,
    tMs,
    eventCount: Array.isArray(state.runLog?.events) ? state.runLog.events.length : 0,
    rngState: Number.isFinite(state.rngState) ? (state.rngState >>> 0) : 0
  });
}

function maybeCheckpointFromEvent(type, tMs) {
  const replay = state.runLog?.replay;
  if (!replay) return;
  const keyTypes = new Set([
    'run_start', 'encounter_start', 'turn_choice', 'switch',
    'use_potion', 'capture_attempt', 'battle_win', 'battle_loss'
  ]);
  const eventCount = Array.isArray(state.runLog?.events) ? state.runLog.events.length : 0;
  const byInterval = eventCount > 0 && (eventCount % REPLAY_CHECKPOINT_INTERVAL === 0);
  if (keyTypes.has(type) || byInterval) {
    appendReplayCheckpoint(type, tMs);
  }
}

function recordReplayAction(actionType, data = {}) {
  const replay = state.runLog?.replay;
  if (!replay || !actionType) return;
  const nowMs = Date.now();
  const baseMs = Number.isFinite(state.runStartedAt) && state.runStartedAt > 0 ? state.runStartedAt : nowMs;
  replay.actionSequence.push({
    idx: replay.actionSequence.length,
    tMs: Math.max(0, nowMs - baseMs),
    action: actionType,
    rngState: Number.isFinite(state.rngState) ? (state.rngState >>> 0) : 0,
    data
  });
}

function recordRunEvent(type, data = {}) {
  if (!state.runLog) return;
  const nowMs = Date.now();
  const baseMs = Number.isFinite(state.runStartedAt) && state.runStartedAt > 0 ? state.runStartedAt : nowMs;
  const tMs = Math.max(0, nowMs - baseMs);
  state.runLog.events.push({
    tMs,
    type,
    rngState: Number.isFinite(state.rngState) ? (state.rngState >>> 0) : 0,
    data: data || {}
  });
  maybeCheckpointFromEvent(type, tMs);
}

async function exportRunLog() {
  if (!state.runLog) {
    alert('No hay run log para exportar.');
    return;
  }
  const payload = JSON.stringify(state.runLog, null, 2);
  const fileSafeSeed = (state.runSeed || 'run').replace(/[^a-zA-Z0-9_-]/g, '_').slice(0, 24);
  const fileName = `runlog-${fileSafeSeed}-${Date.now()}.json`;

  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(payload);
      log('Run log copiado al portapapeles.');
    }
  } catch {}

  const blob = new Blob([payload], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

const replayState = {
  data: null,
  idx: 0,
  playing: false,
  timer: null
};

function setupReplayImporter() {
  const input = $('replay-file-input');
  if (!input || input.dataset.bound === '1') return;
  input.dataset.bound = '1';
  input.addEventListener('change', async (ev) => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      openReplayViewer(data);
    } catch (e) {
      alert('Replay invalido.');
    } finally {
      input.value = '';
    }
  });
}

function importReplayFile() {
  setupReplayImporter();
  const input = $('replay-file-input');
  if (input) input.click();
}

function getReplayEventText(evt) {
  if (!evt) return 'Sin evento';
  const type = evt.type || 'unknown';
  const data = evt.data || {};
  const rng = Number.isFinite(evt.rngState) ? ` | rng=${evt.rngState}` : '';
  return `[${evt.tMs || 0}ms] ${type}${rng}\n${JSON.stringify(data, null, 2)}`;
}

function renderReplayViewer() {
  const header = $('replay-header');
  const box = $('replay-event-box');
  if (!header || !box || !replayState.data) return;
  const total = replayState.data.events?.length || 0;
  const evt = total > 0 ? replayState.data.events[replayState.idx] : null;
  const mode = replayState.data.mode || 'unknown';
  const seed = replayState.data.seed || 'sin-seed';
  const actionCount = replayState.data?.replay?.actionSequence?.length || 0;
  const checkpointCount = replayState.data?.replay?.rngCheckpoints?.length || 0;
  header.innerText = `Replay ${replayState.idx + 1}/${Math.max(total, 1)} | ${mode} | ${seed} | acciones ${actionCount} | checkpoints ${checkpointCount}`;
  box.innerText = getReplayEventText(evt);
  const playBtn = $('btn-replay-play');
  if (playBtn) playBtn.innerText = replayState.playing ? 'Pause' : 'Play';
}

function openReplayViewer(data) {
  if (!data || !Array.isArray(data.events)) {
    alert('Replay invalido: falta lista de eventos.');
    return;
  }
  replayState.data = data;
  replayState.idx = 0;
  replayState.playing = false;
  if (replayState.timer) clearInterval(replayState.timer);
  replayState.timer = null;
  $('replay-overlay').style.display = 'flex';
  renderReplayViewer();
}

function closeReplayViewer() {
  replayState.playing = false;
  if (replayState.timer) clearInterval(replayState.timer);
  replayState.timer = null;
  $('replay-overlay').style.display = 'none';
}

function replayNext() {
  if (!replayState.data || !Array.isArray(replayState.data.events)) return;
  const total = replayState.data.events.length;
  if (!total) return;
  replayState.idx = Math.min(total - 1, replayState.idx + 1);
  renderReplayViewer();
}

function replayPrev() {
  if (!replayState.data || !Array.isArray(replayState.data.events)) return;
  replayState.idx = Math.max(0, replayState.idx - 1);
  renderReplayViewer();
}

function replayTogglePlay() {
  if (!replayState.data || !Array.isArray(replayState.data.events) || replayState.data.events.length === 0) return;
  replayState.playing = !replayState.playing;
  if (replayState.playing) {
    replayState.timer = setInterval(() => {
      if (!replayState.playing) return;
      const total = replayState.data.events.length;
      if (replayState.idx >= total - 1) {
        replayState.playing = false;
        clearInterval(replayState.timer);
        replayState.timer = null;
        renderReplayViewer();
        return;
      }
      replayState.idx++;
      renderReplayViewer();
    }, 700);
  } else if (replayState.timer) {
    clearInterval(replayState.timer);
    replayState.timer = null;
  }
  renderReplayViewer();
}

  if(typeof initAbilities === 'function') initAbilities();

  if (seedInput && !seedInput.value) seedInput.value = autoGenerateSeed();
  renderRunHistory();
  refreshSeedUiState();
  runPluginHook('onInitGame', { state });
}
